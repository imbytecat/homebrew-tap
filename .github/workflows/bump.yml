name: Bump casks

on:
  schedule:
    # daily, off-the-hour to dodge GitHub's :00 cron rush. safe because
    # bumpers short-circuit when upstream version is unchanged.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cask:
        description: "Single cask to bump (leave empty for all)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      casks: ${{ steps.list.outputs.casks }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        env:
          INPUT_CASK: ${{ inputs.cask }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_CASK}" ]; then
            [[ "${INPUT_CASK}" =~ ^[a-z0-9-]+$ ]] || { echo "invalid cask name: ${INPUT_CASK}" >&2; exit 1; }
            test -f "scripts/bump-${INPUT_CASK}.rb" || { echo "no such bumper: scripts/bump-${INPUT_CASK}.rb" >&2; exit 1; }
            casks=$(jq -R -c -n --arg c "$INPUT_CASK" '[$c]')
          else
            casks=$(find scripts -maxdepth 1 -type f -name 'bump-*.rb' -printf '%f\n' \
                    | sed -E 's|^bump-(.+)\.rb$|\1|' \
                    | jq -R -s -c 'split("\n")|map(select(length>0))')
          fi
          echo "casks=${casks}" >> "$GITHUB_OUTPUT"

  bump:
    needs: discover
    if: needs.discover.outputs.casks != '[]'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJSON(needs.discover.outputs.casks) }}
    concurrency:
      group: bump-${{ matrix.cask }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/bump-${{ matrix.cask }}.rb
      - id: diff
        run: |
          if git diff --quiet -- Casks/${{ matrix.cask }}.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: brew style --cask imbytecat/tap/${{ matrix.cask }}
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bump --force --description "Automated cask version bump"
          gh label create automation --force --description "Created by a workflow"
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(${{ matrix.cask }}): 自动 bump 至新版"
          title: "chore(${{ matrix.cask }}): 自动 bump 至新版"
          branch: bot/bump-${{ matrix.cask }}
          delete-branch: true
          add-paths: Casks/${{ matrix.cask }}.rb
          labels: |
            bump
            automation
