name: Bump ugreen-nas

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/bump-ugreen-nas.rb
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "ugreen-nas: bump"
          title: "ugreen-nas: bump"
          branch: bot/bump-ugreen-nas
          delete-branch: true
          add-paths: Casks/ugreen-nas.rb
