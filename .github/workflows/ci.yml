name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: true

      - name: brew style
        run: brew style --cask imbytecat/tap

      - name: brew audit
        run: brew audit --cask --online --tap imbytecat/tap

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rubocop --no-document
      - run: rubocop scripts

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
